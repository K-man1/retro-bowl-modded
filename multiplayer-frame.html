<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online exhibition</title>
<style>
html,body{margin:0;background:#000;overflow:hidden;color:#fff;font:12px monospace}
canvas{image-rendering:pixelated;touch-action:none;position:fixed!important;left:var(--canvas-left,0px)!important;top:var(--canvas-top,0px)!important;width:var(--canvas-width,480px)!important;height:var(--canvas-height,270px)!important;transform:none!important;margin:0;padding:0;border:0}
.gm4html5_div_class{margin:0;padding:0;border:0}
#engine-status{position:fixed;bottom:4px;left:8px;pointer-events:none;white-space:pre-wrap}
#touch-pad{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#touch-pad[hidden]{display:none}
#touch-stick{position:fixed;z-index:1;left:24px;bottom:24px;width:128px;height:128px;box-sizing:border-box;border-radius:50%;background:rgba(255,255,255,.15);border:3px solid rgba(255,255,255,.6);touch-action:none}
#touch-stick span{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.7);pointer-events:none}
#touch-pad button{position:fixed;z-index:1;width:76px;height:76px;padding:0;border-radius:50%;font:bold 12px monospace;color:#fff;background:rgba(26,79,214,.75);border:3px solid #fff;touch-action:none}
#touch-pad button:active{background:rgba(15,47,143,.9)}
#touch-dive{right:24px;bottom:24px}
#touch-switch{right:112px;bottom:64px}
</style>
<body>
<div class="gm4html5_div_class" id="gm4html5_div_id"><canvas id="canvas" width="853" height="480" tabindex="0"></canvas></div>
<output id="engine-status">Loading exhibition engine...</output>
<div id="touch-pad" hidden><div id="touch-stick"><span></span></div><button id="touch-switch" type="button">SWITCH</button><button id="touch-dive" type="button">DIVE</button></div>
<script src="multiplayer-protocol.js"></script>
<script src="multiplayer-engine.js"></script>
<script src="html5game/RetroBowl.js"></script>
</body>
</html>
